services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: final-therapy-sqlserver
    env_file:
      - .env
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${FINAL_THERAPY_DB_PASSWORD}"
    ports:
      - "14335:1433"
    volumes:
      - final_therapy_sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $$MSSQL_SA_PASSWORD -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s
    restart: unless-stopped

volumes:
  final_therapy_sqlserver_data: